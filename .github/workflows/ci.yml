name: host-tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --config Debug --parallel
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: Parse M36 PowerShell launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @(
            '.\tools\m36_sapi_trigger.ps1',
            '.\tools\run_ab_compare.ps1',
            '.\tools\run_m36_original_probe.ps1',
            '.\tools\run_m36_runtime_capture.ps1',
            '.\tools\package_windows_talker.ps1',
            '.\tools\run_original_capture.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "$file`: $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  win32-phone-probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Win32 x86
        run: cmake -S . -B build-win32 -A Win32 -DBUILD_TESTING=ON
      - name: Build M36 Win32 contracts and capture debugger
        run: cmake --build build-win32 --config Debug --target nicolai_m45_span_probe nicolai_m36_phone_probe legacy_phone_features_test nicolai_m36_runtime_capture legacy_runtime_state_test legacy_runtime_executor_m36_test stateful_tds_m36_test nicolai_m36_route_probe m36_route_capture_test m46_linguistic_snapshot_test m46_linguistic_lifecycle_test nicolai_legacy_startup_trace legacy_startup_trace_fixture --parallel
      - name: Run portable Win32 phone-feature corpus
        shell: pwsh
        run: |
          .\build-win32\Debug\legacy_phone_features_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build-win32\Debug\nicolai_m36_phone_probe.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-win32 -C Debug --output-on-failure -R "(m46_linguistic_(snapshot|lifecycle)|m36_route_capture|legacy_runtime_state|legacy_runtime_executor_m36|stateful_tds_m36)_test"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_m36_routes.py --probe build-win32/Debug/nicolai_m36_route_probe.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_m36_startup_trace.py --tracer build-win32/Debug/nicolai_legacy_startup_trace.exe --fixture build-win32/Debug/legacy_startup_trace_fixture.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  metric-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metric dependencies
        run: python -m pip install -r tools/requirements-parity.txt
      - name: Voice-free metric and phone-feature contracts
        run: |
          python tools/test_m35_metrics.py
          python tools/test_m36_phone_features.py
          python tools/test_join_audit.py
          python tools/test_talker_pair_alignment.py
          python tools/test_spectral_balance_m39.py
          python tools/test_transients_m40.py
          python tools/test_join_periods_m42.py
          python tools/test_rhythm_m43.py
          python tools/test_m45_spans.py
          python tools/audit_m46_linguistics.py --self-test
          python tools/compare_original_frontend.py --self-test
          python tools/compare_frontend_delta.py --self-test
          python tools/compare_yo_frontend_m49.py --self-test
          python tools/export_yo_policy_m49.py --self-test
          python tools/export_noun_yo_policy_m50.py --self-test

  windows-test-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure standalone Release
        run: cmake -S . -B build-talker -A Win32 -DNICOLAI_STATIC_RUNTIME=ON -DBUILD_TESTING=ON
      - name: Build test talker
        run: cmake --build build-talker --config Release --target NicolaiTalker talker_backend_test russian_frontend_test russian_stress_test word_rhythm_m43_test russian_lexicon_m44_test russian_lexicon_m47_test russian_lexicon_m48_test russian_yo_m49_test russian_noun_yo_m50_test nicolai_m48_lexicon_probe nicolai_m49_lexicon_probe nicolai_m50_lexicon_probe --parallel
      - name: Run voice-free UI and profile contracts
        run: ctest --test-dir build-talker -C Release --output-on-failure -R "talker_(backend_test|ui_smoke|original_trace_smoke)|russian_(frontend|stress)_test|word_rhythm_m43_test|russian_lexicon_m4[478]_test|russian_(yo_m49|noun_yo_m50)_test"
      - name: Package without proprietary inputs
        shell: pwsh
        run: ./tools/package_windows_talker.ps1 -BuildDir build-talker -IncludeOriginalTraceLauncher
      - name: Verify packaged EXE and ZIP
        run: python tools/test_windows_talker.py --exe build-talker/Release/NicolaiTalker.exe --zip out/Nicolai-Test-win32.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Nicolai-Test-win32
          path: out/Nicolai-Test-win32.zip
          if-no-files-found: error
          retention-days: 30
