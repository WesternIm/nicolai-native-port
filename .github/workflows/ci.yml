name: host-tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --config Debug --parallel
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: Parse M36 PowerShell launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @(
            '.\tools\run_ab_compare.ps1',
            '.\tools\run_m36_original_probe.ps1',
            '.\tools\run_m36_runtime_capture.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "$file`: $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  win32-phone-probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Win32 x86
        run: cmake -S . -B build-win32 -A Win32 -DBUILD_TESTING=ON
      - name: Build M36 Win32 contracts and capture debugger
        run: cmake --build build-win32 --config Debug --target nicolai_m36_phone_probe legacy_phone_features_test nicolai_m36_runtime_capture --parallel
      - name: Run portable Win32 phone-feature corpus
        shell: pwsh
        run: |
          .\build-win32\Debug\legacy_phone_features_test.exe
          .\build-win32\Debug\nicolai_m36_phone_probe.exe

  metric-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metric dependencies
        run: python -m pip install -r tools/requirements-parity.txt
      - name: Voice-free metric and phone-feature contracts
        run: |
          python tools/test_m35_metrics.py
          python tools/test_m36_phone_features.py
